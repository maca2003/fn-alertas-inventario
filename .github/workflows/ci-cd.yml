name: CI/CD fn-alertas-inventario

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK: fn-alertas-inventario

jobs:
  # 1. Compila y ejecuta las pruebas unitarias
  build-test:
    name: Build y test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, probar y empaquetar
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: funcion-jar
          path: target/fn-alertas-inventario-1.0.0.jar

  # 2. Provisiona la infraestructura (S3, SQS, DLQ, Lambda, alarma) y despliega la función
  deploy:
    name: Provisionar y desplegar en AWS
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: funcion-jar
          path: target

      - name: Credenciales AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Provisionar bucket S3 para el código
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="fn-alertas-inventario-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET"
          fi
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Subir el .jar a S3
        run: |
          KEY="codigo/fn-alertas-inventario-${GITHUB_SHA}.jar"
          aws s3 cp target/fn-alertas-inventario-1.0.0.jar "s3://${BUCKET}/${KEY}"
          echo "KEY=$KEY" >> "$GITHUB_ENV"

      - name: Provisionar SQS + DLQ + Lambda + alarma (CloudFormation)
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file infraestructura/template.yaml \
            --parameter-overrides CodigoBucket="$BUCKET" CodigoKey="$KEY" \
            --no-fail-on-empty-changeset

      - name: Mostrar salidas del stack
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs" --output table

      - name: Probar la función con un evento de ejemplo
        run: |
          aws lambda invoke \
            --function-name fn-alertas-inventario \
            --payload fileb://eventos/evento-prueba.json \
            salida.json
          cat salida.json
